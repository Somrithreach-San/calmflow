<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Prevent theme flash -->
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("theme");
          if (savedTheme) {
            document.documentElement.setAttribute("data-theme", savedTheme);
          }
        } catch (e) {
          console.log("Theme initialization error:", e);
        }
      })();
    </script>
    <title>Sign Up - Calm Flow</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='icons/favicon.png') }}"
    />
  </head>
  <body>
    <div class="site-container">
      <header class="site-header">
        <div class="header-container">
          <a href="/" class="logo">Calm Flow</a>
          <div class="header-controls">
            <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
              <img
                src="{{ url_for('static', filename='icons/sun.png') }}"
                alt="Sun"
                class="theme-icon sun"
              />
              <img
                src="{{ url_for('static', filename='icons/moon.png') }}"
                alt="Moon"
                class="theme-icon moon"
              />
            </button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="signup-container">
          <div class="signup-box">
            <div class="signup-form-container">
              <h2 class="section-title">Sign Up</h2>
              <form
                class="signup-form"
                method="POST"
                action="{{ url_for('signup') }}"
              >
                <div class="form-group">
                  <label for="username">Username</label>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                  />
                </div>
                <div class="form-group">
                  <label for="email">Email</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    autocomplete="email"
                  />
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <div class="password-input-wrapper">
                    <input
                      type="password"
                      id="password"
                      name="password"
                      required
                      autocomplete="new-password"
                    />
                    <button
                      type="button"
                      class="toggle-password-btn"
                      aria-label="Toggle password visibility"
                    >
                      Show
                    </button>
                  </div>
                </div>
                <button type="submit" class="action-button">
                  Create Account
                </button>
              </form>
              <p class="login-link">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
              </p>
              <div class="guest-link-wrapper" style="margin-top: 1.25rem; text-align: center;">
                <a href="{{ url_for('index') }}" class="guest-link" style="color: var(--text-primary); font-family: 'Impact', sans-serif; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; opacity: 0.7; text-decoration: none; border-bottom: 1px dashed var(--border-color); padding-bottom: 2px;">
                  &larr; Explore as Guest (No Login Required)
                </a>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="toast-container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="toast toast-{{ category }}">
        <p class="toast-message">{{ message }}</p>
        <button class="toast-close">&times;</button>
      </div>
      {% endfor %} {% endif %} {% endwith %}
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
